version: '3.8'

services:
  # Backend API Server
  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/jansamadhan}
      - JWT_SECRET=${JWT_SECRET:-supersecretkey}
      - CLIENT_URL=http://localhost:3000
    depends_on:
      - postgres
    restart: always

  # Local PostgreSQL (compatible with Neon / Supabase in production)
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=jansamadhan
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
