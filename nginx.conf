# ===================================================================
# JanSamadhan — Production Nginx Config
# Designed for 1,00,000+ concurrent users
# ===================================================================

# Worker configuration for high concurrency
worker_processes auto;              # 1 worker per CPU core
worker_rlimit_nofile 65535;         # Max open files

events {
    worker_connections 10240;        # 10K connections per worker
    multi_accept on;                 # Accept multiple connections at once
    use epoll;                       # Efficient event handling (Linux)
}

http {
    # ===== BASIC SETTINGS =====
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;               # Hide Nginx version (security)
    client_max_body_size 10M;        # Max upload size

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ===== LOGGING =====
    access_log /var/log/nginx/jansamadhan_access.log;
    error_log /var/log/nginx/jansamadhan_error.log;

    # ===== GZIP COMPRESSION =====
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ===== RATE LIMITING ZONES =====
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ===== UPSTREAM: Node.js Cluster (PM2) =====
    upstream jansamadhan_backend {
        least_conn;                  # Route to least busy instance
        server 127.0.0.1:5000;
        keepalive 64;                # Keep connections alive
    }

    # ===== HTTP → HTTPS REDIRECT =====
    server {
        listen 80;
        server_name jansamadhan.gov.in www.jansamadhan.gov.in;
        return 301 https://$server_name$request_uri;
    }

    # ===== MAIN HTTPS SERVER =====
    server {
        listen 443 ssl http2;
        server_name jansamadhan.gov.in www.jansamadhan.gov.in;

        # ===== SSL CONFIGURATION (MITM Prevention) =====
        ssl_certificate /etc/ssl/certs/jansamadhan.crt;
        ssl_certificate_key /etc/ssl/private/jansamadhan.key;
        ssl_protocols TLSv1.2 TLSv1.3;    # Only modern TLS
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1h;
        ssl_stapling on;
        ssl_stapling_verify on;

        # ===== SECURITY HEADERS =====
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

        # ===== FRONTEND (React Static Build) =====
        root /var/www/jansamadhan/frontend/build;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
            expires 1d;
            add_header Cache-Control "public, no-transform";
        }

        # ===== STATIC ASSETS (aggressive caching) =====
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|webp)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ===== API PROXY — to Node.js Backend =====
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            limit_conn conn_limit 20;

            proxy_pass http://jansamadhan_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ===== AUTH ENDPOINT (stricter rate limit) =====
        location /api/auth/ {
            limit_req zone=auth_limit burst=15 nodelay;
            limit_conn conn_limit 10;

            proxy_pass http://jansamadhan_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ===== BLOCK SENSITIVE FILES =====
        location ~ /\.(env|git|htaccess|htpasswd) {
            deny all;
            return 404;
        }

        # ===== WAF: Block common attack paths =====
        location ~* (wp-admin|wp-login|phpmyadmin|adminer|\.php$) {
            deny all;
            return 444;   # Drop connection silently
        }
    }
}
